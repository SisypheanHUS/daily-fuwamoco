org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler tries to compute a relative path between the
# project (E:\...) and the Gradle/Kotlin build-tools-api caches under the Pub
# cache (C:\...). Windows has no relative path across drive letters, so that
# throws "this and base files have different roots" and fails the build.
# Disabling incremental compilation avoids the relative-path computation.
kotlin.incremental=false
